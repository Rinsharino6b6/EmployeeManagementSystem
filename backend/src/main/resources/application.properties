# Password reset email settings. Set MAIL_HOST, MAIL_PORT, MAIL_USERNAME,
# MAIL_PASSWORD and MAIL_FROM in the backend environment. The defaults below
# are for local development only and do not deliver email to real inboxes.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Set these backend environment variables to the office's coordinates.
app.attendance.office.latitude=${OFFICE_LATITUDE:}
app.attendance.office.longitude=${OFFICE_LONGITUDE:}
app.attendance.office.radius-meters=${OFFICE_RADIUS_METERS:150}